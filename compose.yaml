services:
  rag-app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      CHROMA_DB_DIR: /app/data/chroma_db
      DOCUMENTS_DIR: /app/documents
      GEMINI_CHAT_MODEL: gemini-3.5-flash-lite
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
    volumes:
      - ./app:/app/app
      - ./documents:/app/documents
      - ./data:/app/data